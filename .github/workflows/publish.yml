# Publish aile.sh to npm, with provenance.
#
# WHY PROVENANCE, AND WHY IT IS THE WHOLE POINT FOR THIS PACKAGE. This client is
# open source and installed with `npm i -g aile.sh`, which means the source anyone
# can read and the code anyone actually runs are two different artefacts. Nothing
# ordinarily connects them: a tarball published from someone's laptop could contain
# anything, and no user could tell. `--provenance` makes npm mint a Sigstore
# attestation binding the published tarball to this repository, this commit, and
# this workflow — so "the client is open source" becomes a checkable claim rather
# than a promise. Anyone can verify with:
#
#     npm audit signatures
#
# PUBLISHING FROM A LAPTOP DEFEATS THIS. Provenance can only be generated by a CI
# run with an OIDC identity, so a manual `npm publish` produces an unattested
# version — and an unattested version sitting in the same registry is exactly the
# gap an attacker needs. Publish here or not at all.
#
# THE NAME MUST BE OWNED BEFORE ANY OF THIS MATTERS. An unclaimed `aile.sh` on npm
# means the documented install command points at whatever a stranger publishes
# first, and provenance on a package nobody has claimed protects nothing.
#
# TWO PRECONDITIONS THAT ARE NOT IN THIS FILE, AND THAT BOTH FAIL THE PUBLISH:
#
#   1. THE REPOSITORY MUST BE PUBLIC. npm does not generate provenance for a
#      package built from a private repository, whatever the package's own
#      visibility. A private repo here yields either a hard failure or an
#      unattested version, which is the case this whole file exists to avoid.
#
#   2. `repository.url` IN package.json MUST MATCH THIS REPO, CASE FOR CASE.
#      Sigstore compares it against the owner/repo in the GitHub OIDC claim, and
#      a difference of one capital letter fails verification with a 422 and
#      publishes nothing. It currently reads `ailelabs/aile.sh`.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # REQUIRED for provenance — without it the publish is unattested

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Node is what publishes; bun only builds. npm >= 9.5 is required for
      # --provenance, and the registry URL must be set here or npm publishes
      # without the OIDC exchange and silently drops the attestation.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - run: bun install --frozen-lockfile

      # The gate. A client that cannot pass its own tests must not reach a machine
      # that will run it unattended via `aile update`.
      - run: bun test --isolate

      - run: bun run build

      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
